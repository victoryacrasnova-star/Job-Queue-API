services:

  postgres:
    image: postgres:16
    container_name: job_queue_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_queue_db
    ports:
      - "5433:5432"

  redis:
    image: redis
    container_name: job_queue_redis
    ports:
      - "16379:6379"

  backend:
    build: .
    container_name: job_queue_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/job_queue_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: job_queue_worker
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/job_queue_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis